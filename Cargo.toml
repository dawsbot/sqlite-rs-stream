[package]
name = "sqlite-rs-stream"
version = "0.1.0"
edition = "2024"
description = "Litestream-compatible SQLite replication to S3, running inside your process"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crc = "3.4.0"
futures = "0.3.34"
gethostname = "1.1.0"
lz4_flex = "0.14.0"
object_store = { version = "0.14.2", features = ["aws"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
